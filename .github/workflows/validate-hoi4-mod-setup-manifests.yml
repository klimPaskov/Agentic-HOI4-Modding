name: Validate HOI4 Mod Setup manifests

on:
  push:
    branches: [main]
    paths:
      - "hoi4-mod-setup.manifest.json"
      - "hoi4-mod-setup.v2.manifest.json"
      - "schemas/hoi4-mod-setup.v2.schema.json"
      - "scripts/generate_manifest_evidence.py"
      - "scripts/validate_published_manifests.py"
      - "scripts/test_generate_manifest_evidence.py"
      - ".tools/mcp/**"
      - ".tools/3d_pipeline/**"
  pull_request:
    paths:
      - "hoi4-mod-setup.manifest.json"
      - "hoi4-mod-setup.v2.manifest.json"
      - "schemas/hoi4-mod-setup.v2.schema.json"
      - "scripts/**"
      - ".tools/mcp/**"
      - ".tools/3d_pipeline/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python scripts/validate_published_manifests.py
