name: Validate HOI4 Mod Setup manifests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hoi4-mod-setup.manifest.json"
      - "schemas/hoi4-mod-setup.v3.schema.json"
      - "schemas/hoi4-mod-setup.v4.schema.json"
      - "scripts/generate_manifest_evidence.py"
      - "scripts/image_generation_provider_data.py"
      - "scripts/validate_published_manifests.py"
      - "scripts/test_generate_manifest_evidence.py"
      - "scripts/test_image_generation_*.py"
      - "scripts/test_agent_sync_contract.py"
      - "scripts/check_release_package.py"
      - "README.md"
      - "RELEASING.md"
      - "docs/**"
      - "hoi4_wiki/**"
      - ".codex/**"
      - ".tools/clients/**"
      - "CLAUDE_template.md"
      - "AGENTS_template.md"
      - ".claude/**"
      - "scripts/coding_environment_data.py"
      - "scripts/test_coding_environment_data.py"
      - "schemas/remote-manifest.v6.schema.json"
      - "schemas/remote-manifest.v7.schema.json"
      - ".tools/sync/**"
      - ".tools/mcp/**"
      - ".tools/3d_pipeline/**"
      - ".tools/image_generation/**"
      - ".tools/check.py"
      - ".tools/quality.py"
      - ".tools/quality_baseline.json"
      - ".tools/requirements-dev.txt"
      - ".tools/lib/**"
      - ".tools/audits/**"
      - ".tools/gfx/**"
      - ".tools/tests/**"
      - ".tools/ruff.toml"
      - ".tools/py.sh"
      - ".tools/wiki/**"
      - ".gitattributes"
      - "scripts/check_shared_tools.py"
      - "scripts/shared_tools.json"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1" "Pillow==12.2.0" "openpyxl==3.1.5" "numpy==2.2.6" "scipy==1.15.3" "uv==0.7.8"
      # A pull request cannot publish evidence. Regenerate it for the exact
      # head commit with the owned generator and keep it as a reviewable
      # artifact before the strict checks below run.
      - name: Preview exact-revision evidence for the pull request head
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          cp hoi4-mod-setup.manifest.json "$RUNNER_TEMP/evidence/hoi4-mod-setup.manifest.json"
          python scripts/generate_manifest_evidence.py --manifest "$RUNNER_TEMP/evidence/hoi4-mod-setup.manifest.json" --source-root . --revision "$HEAD_SHA"
          echo "$HEAD_SHA" > "$RUNNER_TEMP/evidence/REVISION"
      - name: Keep the previewed manifest
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hoi4-mod-setup-manifest-preview
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python scripts/test_agent_sync_contract.py
      - run: python -m compileall -q .tools/3d_pipeline
      - run: python -m unittest discover -s .tools/3d_pipeline/tests -p "test_*.py"
      - run: python .tools/3d_pipeline/verify_environment.py
      - run: python -m unittest discover -s .claude/skills/hoi4-feature-assets/tools/tests -p "test_*.py"
      - run: python -m unittest discover -s .claude/skills/xlsx/tests -p "test_*.py"
      - run: python -m unittest discover -s .tools/tests -p "test_*.py"
      - run: python -m unittest discover -s .tools/gfx -p "test_*.py"
      - run: python scripts/check_shared_tools.py
      # Checks that need no installed game; ruff and mypy run inside `quality`.
      - run: python .tools/check.py full --only script-rules gfx shelf guidance generators quality
      # The one-command mod preparation must work on a fresh Linux checkout (writes only machine-local files).
      - run: |
          mkdir -p "$RUNNER_TEMP/hoi4/common" "$RUNNER_TEMP/hoi4/localisation"
          python .tools/check.py setup --save-game-dir "$RUNNER_TEMP/hoi4"
      # Every generator and size check in .tools/sync/generators.json, in check mode. Pull requests run it
      # unfiltered, so a required check always reports.
      - run: python .tools/sync/generators.py --check
      - run: python .tools/wiki/verify_wiki_snapshot.py --quiet
      - run: python scripts/check_release_package.py
      - run: python scripts/validate_published_manifests.py

  # The generator runner, the hook and the launcher run on every machine the kit supports.
  sync-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: sh .tools/py.sh -c "import sys; print(sys.version)"
      - run: python -B -m unittest discover -s .tools/tests -p "test_sync.py"
      - run: python -B .tools/sync/generators.py --check
