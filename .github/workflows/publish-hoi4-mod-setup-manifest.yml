name: Publish HOI4 Mod Setup manifest

on:
  push:
    branches: [main]
    paths-ignore:
      - hoi4-mod-setup.manifest.json
      - hoi4-mod-setup.v2.manifest.json

concurrency:
  group: hoi4-mod-setup-manifest-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Test manifest generator
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Regenerate exact-revision evidence
        run: >-
          python scripts/generate_manifest_evidence.py
          --manifest hoi4-mod-setup.v2.manifest.json
          --legacy-manifest hoi4-mod-setup.manifest.json
          --source-root .
          --revision "$GITHUB_SHA"
      - name: Verify bounded change
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only -- . ':!hoi4-mod-setup.manifest.json' ':!hoi4-mod-setup.v2.manifest.json')"
          test -z "$unexpected" || { echo "Unexpected generated changes: $unexpected"; exit 1; }
          git diff --check
      - name: Publish generated manifest
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$GITHUB_SHA" || { echo "main advanced; a newer run will publish the manifest"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- hoi4-mod-setup.manifest.json hoi4-mod-setup.v2.manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh setup package manifest"
          git push origin HEAD:main
