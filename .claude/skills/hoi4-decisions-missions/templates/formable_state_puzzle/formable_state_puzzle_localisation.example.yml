l_english:
  <FORMABLE_ID>_formable_category: "Formation Territory"
  <FORMABLE_ID>_formable_category_desc: "The territory proof is shown as exact installed-map state pieces. Grey hatched pieces are unresolved; green pieces carry a check or solid keyline when they qualify."
  <FORMABLE_ID>_summary_line: "Qualifying states: [formable_<FORMABLE_ID>_qualifying_count_text] / <REQUIRED_COUNT> — [formable_<FORMABLE_ID>_summary_status_text]"
  <FORMABLE_ID>_qualifying_count_0: "0"
  <FORMABLE_ID>_qualifying_count_1: "1"
  <FORMABLE_ID>_qualifying_count_2: "2"
  <FORMABLE_ID>_qualifying_count_3: "3"
  <FORMABLE_ID>_summary_ready: "Formation ready"
  <FORMABLE_ID>_summary_blocked: "Formation blocked"
  <FORMABLE_ID>_formation_requirements_tt: "The formation decision checks the fixed state and the alternate group through formable_<FORMABLE_ID>_territory_qualifies. The count is presentation only and never bypasses the decision availability trigger."

  # Generic dynamic-list state-scope hover keys.
  <FORMABLE_ID>_state_hover_qualifying: "[This.GetName] — owner: [formable_<FORMABLE_ID>_state_owner_name]; controller: [formable_<FORMABLE_ID>_state_controller_name]; control: [formable_<FORMABLE_ID>_state_control_result]; core: [formable_<FORMABLE_ID>_state_core_result]; status: [<FORMABLE_ID>_state_status_qualifies]."
  <FORMABLE_ID>_state_hover_unresolved: "[This.GetName] — owner: [formable_<FORMABLE_ID>_state_owner_name]; controller: [formable_<FORMABLE_ID>_state_controller_name]; control: [formable_<FORMABLE_ID>_state_control_result]; core: [formable_<FORMABLE_ID>_state_core_result]; status: [<FORMABLE_ID>_state_status_unresolved]."
