  <FORMABLE_ID>_state_controller_present: "[This.controller.GetNameDef]"
  <FORMABLE_ID>_state_owner_absent: "No current owner"
  <FORMABLE_ID>_state_controller_absent: "No current controller"
  <FORMABLE_ID>_state_control_yes: "Controlled by the forming country"
  <FORMABLE_ID>_state_control_no: "Not controlled by the forming country"
  <FORMABLE_ID>_state_core_yes: "Core of the forming country"
  <FORMABLE_ID>_state_core_no: "Not a core of the forming country"
  <FORMABLE_ID>_state_status_qualifies: "Qualifies"
  <FORMABLE_ID>_state_status_unresolved: "Unresolved"

