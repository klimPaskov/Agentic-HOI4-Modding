approval_policy = "never"

sandbox_mode = "danger-full-access"

project_doc_max_bytes = 184320

[agents]
max_threads = 24
max_depth = 2

[mcp_servers.hoi4_agent_tools]
command = "hoi4-agent-tools.cmd"
cwd = "."
startup_timeout_sec = 120
tool_timeout_sec = 180
default_tools_approval_mode = "auto"

[mcp_servers.comfy_cloud_portraits]
url = "https://cloud.comfy.org/mcp"

# 3D MCP routes are intentionally absent until a feature actually needs a
# model. The 3D agent runs the repository-owned bootstrap at that point and
# materializes concrete Meshy and Blender entries without user editing.

[agents.hoi4_3d_model_pipeline]
description = "Creates, rigs, animates, processes, exports, audits, and documents bounded HOI4 3D model packages through an explicit Meshy 7 verified Meshy-to-Blender-to-io_pdx_mesh workflow, including substantive approved-action provenance, rights-checked Internet-sourced custom-unit sound design, and bespoke vanilla-green unit-counter handoffs. Planned model, animation, and bounded failure-driven provider recovery are pre-authorized while balance and capability permit them. Never creates audio manually or through generation and never claims final gameplay completion."
config_file = "agents/hoi4_3d_model_pipeline.toml"

[agents.hoi4_ai_probability_auditor]
description = "Read-only scenario auditor for HOI4 AI weights, MTTH, event option chances, random lists, focus and research selection, decision and mission scores, AI strategy factors, and declared weighted pools. Uses the mandatory HOI4 MCP probability workflow and does not patch source or choose balance targets."
config_file = "agents/hoi4_ai_probability_auditor.toml"

[agents.hoi4_asset_source_researcher]
description = "Finds, verifies, processes, and documents non-portrait real or archival visual source assets for HOI4 mods, including report, news, presentation, historical-flag, and attested-symbol assets. Character portraits belong entirely to hoi4_portrait_creator."
config_file = "agents/hoi4_asset_source_researcher.toml"

[agents.hoi4_audio_researcher]
description = "Researches, verifies, downloads, edits, converts, and documents licensed or public-domain audio for HOI4 mod presentation surfaces. Does not wire audio into scripts or sound definitions."
config_file = "agents/hoi4_audio_researcher.toml"

[agents.hoi4_country_package_auditor]
description = "Active auditor and small-patch subagent for HOI4 country packages. Checks and can patch tags, history, states, leaders, portraits, flags, parties, focus loading, ideas, advisors, units, technology, claims, cores, localisation, AI, formables, and playable setup inside the current task scope."
config_file = "agents/hoi4_country_package_auditor.toml"

[agents.hoi4_decision_mission_auditor]
description = "Active auditor and small-patch subagent for HOI4 decisions, missions, timed objectives, decision categories, scripted GUI decision surfaces, costs, tooltips, AI behavior, cleanup, balance, and exploit risk."
config_file = "agents/hoi4_decision_mission_auditor.toml"

[agents.hoi4_documentation_curator]
description = "Documentation cleanup and consistency subagent for HOI4 mods. Reconciles specs, plans, docs, handoffs, manifests, prompts, reports, README files, and accidental Markdown hard wraps with accepted decisions and current implementation evidence. Does not edit gameplay files or external tabular data files."
config_file = "agents/hoi4_documentation_curator.toml"

[agents.hoi4_event_ui_worker]
description = "Luna Max implementation and visual-layout worker for a scripted GUI introduced by one named event or event-owned mechanic. It must use the HOI4 MCP GUI inspect, render, rewrite, and post-change comparison workflow and follow the decision-layout contract. It never audits shared interfaces such as event logs, event-detail frameworks, settings, or unrelated existing UIs."
config_file = "agents/hoi4_event_ui_worker.toml"

[agents.hoi4_feature_completion_auditor]
description = "Read-only completion auditor for HOI4 mod feature implementation. Compares specs, plans, prompts, and repo files, then flags missing mechanics, fallbacks, simplifications, docs gaps, asset gaps, validation gaps, and unresolved addenda."
config_file = "agents/hoi4_feature_completion_auditor.toml"

[agents.hoi4_focus_tree_auditor]
description = "Active auditor and small-patch subagent for HOI4 focus trees. Checks and can patch route logic, prerequisites, mutual exclusions, rewards, icons, localisation, AI, formable links, and simplifications inside the current task scope."
config_file = "agents/hoi4_focus_tree_auditor.toml"

[agents.hoi4_generated_feature_art]
description = "Generates and processes non-icon fictional, symbolic, supernatural, alternate-history, Second World War-style report, news, large feature presentation, UI, flag, and faction-emblem art for HOI4 mods. Final character portraits use the dedicated portrait worker. Does not edit GFX or gameplay files."
config_file = "agents/hoi4_generated_feature_art.toml"

[agents.hoi4_icon_artist]
description = "Creates generated icon asset packages, bespoke vanilla-green custom-unit counter packages, and frame-by-frame small animated sprite packages for HOI4 mods. Unit counters require exact installed-vanilla definition/DDS inspection and matching reference-family evidence before production. Use for focus, idea, decision, achievement, technology, special-project, scripted GUI, formable seal, route-state, and other gameplay icon surfaces. Does not edit GFX or gameplay files unless parent scope explicitly changes it."
config_file = "agents/hoi4_icon_artist.toml"

[agents.hoi4_improvement_loop_planner]
description = "Plan-only improvement loop subagent for HOI4 mods. Writes deep expansion addenda with research, historical connections, playable mechanics, and implementation handoffs. Does not patch gameplay files."
config_file = "agents/hoi4_improvement_loop_planner.toml"

[agents.hoi4_localisation_auditor]
description = "Active auditor and patch subagent for HOI4 localisation, scripted localisation, dynamic text, tooltip quality, key coverage, encoding, cross-surface consistency, and direct, concise, readable player-facing prose."
config_file = "agents/hoi4_localisation_auditor.toml"

[agents.hoi4_quote_remark_researcher]
description = "Finds, verifies, compares, and documents quote, cultural remark, slogan, title-reference, and allusion candidates for a HOI4 feature. Does not edit localisation or gameplay files."
config_file = "agents/hoi4_quote_remark_researcher.toml"

[agents.hoi4_repo_explorer]
description = "Read-only HOI4 mod repository explorer for large or uncertain tasks. Maps relevant files, vanilla precedents, risks, validation checks, dependencies, and edit order. Does not patch gameplay files."
config_file = "agents/hoi4_repo_explorer.toml"

[agents.hoi4_scripted_system_architect]
description = "Active architect and narrow implementation subagent for reusable HOI4 scripted effects, scripted triggers, script constants, event targets, meta effects, variables, tuning tables, formable helpers, scripted GUI helpers, and dynamic helper logic."
config_file = "agents/hoi4_scripted_system_architect.toml"

[agents.hoi4_skill_maintainer]
description = "Creates, updates, audits, and trims HOI4 mod repository skills. Use when a reusable workflow, repeated mistake, validation pattern, asset workflow, prompt pattern, or project convention should be captured in a skill. Does not edit gameplay files."
config_file = "agents/hoi4_skill_maintainer.toml"

[agents.hoi4_spreadsheet_doc_worker]
description = "Optional spreadsheet-only worker for mod-maintained CSV/XLSX tables when a repository actually has them or the parent explicitly requests them. Preserves formatting and aligns fields with source-of-truth implementation or localisation provided by the parent."
config_file = "agents/hoi4_spreadsheet_doc_worker.toml"

[agents.hoi4_super_event_art_researcher]
description = "Finds, verifies, and documents archival or real-world image candidates for registered HOI4 super-events without editing runtime wiring."
config_file = "agents/hoi4_super_event_art_researcher.toml"

[agents.hoi4_super_event_audio_researcher]
description = "Researches, verifies, downloads, converts, and documents unique rights-checked Internet-sourced audio for registered HOI4 super-events. Never generates or manually authors the sound and does not edit runtime wiring."
config_file = "agents/hoi4_super_event_audio_researcher.toml"

[agents.hoi4_super_event_quote_researcher]
description = "Finds, verifies, compares, and documents quote and cultural-remark candidates for registered HOI4 super-events without editing localisation or runtime wiring."
config_file = "agents/hoi4_super_event_quote_researcher.toml"

# HOI4_MOD_SETUP_PORTRAITS_START
[agents.hoi4_portrait_creator]
description = "Owns complete HOI4 portrait production: grounded-source research and source placeholders, fictional ImageGen portraits, user-supplied styled-result validation, processing, DDS conversion, portrait wiring, manifests, and handoffs. Never operates RunPod."
config_file = "agents/hoi4_portrait_creator.toml"
# HOI4_MOD_SETUP_PORTRAITS_END
